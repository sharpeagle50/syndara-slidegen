[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syndara-slidegen"
version = "0.1.0"
description = "AI pipeline that generates and redesigns PowerPoint decks — the slide engine behind Syndara"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "claude-agent-sdk>=0.2.111",  # builder pins model="claude-sonnet-5"; needs the bundled CLI 2.1.197+ (SDK >=0.2.111)
    "python-pptx>=0.6",
    "Pillow>=10",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Extra diagram renderers (graphviz flowcharts, SVG rasterization).
diagrams = ["graphviz", "cairosvg"]
# Rich text extraction for --context-file / --context-dir (PDF, Word, PowerPoint, Excel).
context = ["pypdf>=4.0", "python-docx>=1.0", "python-pptx>=0.6.21", "openpyxl>=3.1"]
# Concept-animation engine (deckgen.animation): agents that write + self-correct Manim scenes.
# manim needs Python >= 3.11 and the Cairo/Pango toolchain; modal is only for remote rendering.
animation = ["manim>=0.18", "manim-voiceover>=0.3", "modal"]

[project.scripts]
deckgen = "deckgen.cli:main"

[project.urls]
Homepage = "https://github.com/sharpeagle50/syndara-slidegen"

# The repository root *is* the `deckgen` package (agents/ and tools/ are its
# subpackages), so map the package name onto the root directory.
[tool.setuptools]
packages = ["deckgen", "deckgen.agents", "deckgen.animation", "deckgen.tools"]

[tool.setuptools.package-dir]
deckgen = "."

# The Node renderer (pptxgen_runner.js + npm manifests) ships inside the
# package — PptxGenSession resolves these relative to __file__.
[tool.setuptools.package-data]
"deckgen.tools" = ["*.js", "package.json", "package-lock.json"]
